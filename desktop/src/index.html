<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; media-src * blob: data:; connect-src https: http:; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IPTV Player</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #0E0F14; color: #fff; font-family: Segoe UI, Roboto, sans-serif; }
    .view { display: none; height: 100%; }
    .view.on { display: flex; }
    #act { align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding: 20px; }
    #act input { width: 320px; max-width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #1A1C25; color: #fff; font-size: 16px; }
    #act input#code { text-align: center; letter-spacing: 8px; font-size: 24px; }
    button { cursor: pointer; border: 0; border-radius: 10px; padding: 11px 16px; font-size: 15px; background: #FF3B5C; color: #fff; }
    button.alt { background: #262A38; }
    button.link { background: transparent; color: #9AA0B4; }
    button:focus-visible { outline: 2px solid #fff; }
    .err { color: #FF3B5C; min-height: 20px; font-size: 14px; }
    .muted { color: #9AA0B4; font-size: 13px; }
    #main { flex-direction: column; padding: 16px; gap: 10px; }
    #list { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; align-items: center; gap: 14px; padding: 10px; background: #1A1C25; border-radius: 14px; cursor: pointer; }
    .row:hover, .row:focus { outline: 2px solid #FF3B5C; }
    .logo { width: 80px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
    .logo img { max-width: 100%; max-height: 100%; }
    .info { flex: 1; } .info b { font-size: 17px; } .info div { color: #9AA0B4; font-size: 12px; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    #player { position: relative; background: #000; }
    video { width: 100%; height: 100%; background: #000; }
    #top { position: absolute; top: 0; left: 0; right: 0; display: flex; gap: 8px; align-items: center; padding: 8px; background: rgba(0,0,0,.55); transition: opacity .3s; }
    #top.hide { opacity: 0; pointer-events: none; }
    #ptitle { flex: 1; text-align: center; font-weight: 700; }
    #perr { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,.6); padding: 12px 16px; border-radius: 10px; display: none; text-align: center; }
    #page { flex-direction: column; padding: 24px; gap: 14px; overflow: auto; }
    #page pre { white-space: pre-wrap; font: inherit; line-height: 1.6; margin: 0; }
  </style>
</head>
<body>
  <!-- Aktivatsiya -->
  <div id="act" class="view">
    <h1>📺 IPTV Player</h1>
    <div class="muted">PRIVATE • Faqat aktivatsiya kodi bilan</div>
    <input id="name" placeholder="Foydalanuvchi nomi" maxlength="32" />
    <input id="code" placeholder="••••••" maxlength="6" inputmode="numeric" />
    <div id="aerr" class="err"></div>
    <button id="go">Faollashtirish</button>
    <button id="tg" class="link">Kod olish: t.me/ilhomvich_sh</button>
  </div>

  <!-- Asosiy -->
  <div id="main" class="view">
    <h2 style="margin:0">📺 IPTV Player • PRIVATE</h2>
    <div class="bar">
      <span class="muted">Server:</span>
      <label><input type="radio" name="srv" value="stream2" /> stream2</label>
      <label><input type="radio" name="srv" value="stream8" /> stream8</label>
    </div>
    <div id="list"></div>
    <div class="bar">
      <button class="alt" data-page="subs">Obunalarim</button>
      <button class="alt" data-page="account">Akkaunt</button>
      <button class="alt" data-page="help">Yordam</button>
      <button class="alt" data-page="about">Haqida</button>
    </div>
  </div>

  <!-- Player -->
  <div id="player" class="view">
    <video id="video" autoplay></video>
    <div id="top">
      <button class="alt" id="back">◀ Orqaga</button>
      <div id="ptitle"></div>
      <button class="alt" id="prev">⏮</button>
      <button class="alt" id="next">⏭</button>
      <button class="alt" id="pip">PiP</button>
      <button class="alt" id="fs">⛶</button>
    </div>
    <div id="perr"></div>
  </div>

  <!-- Sahifalar -->
  <div id="page" class="view">
    <h2 id="pt" style="margin:0"></h2>
    <pre id="pb"></pre>
    <div class="bar" id="pbtn"></div>
    <div class="bar"><button class="alt" id="pclose">◀ Orqaga</button></div>
  </div>

  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
