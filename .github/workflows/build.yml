name: Build IPTV Player

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (Phone + TV)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            cmdline-tools;latest
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"

      - name: Build Debug + Release APK
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease --stacktrace

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Android
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows EXE
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Inject TOTP secret (optional)
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          if [ -n "$TOTP_SECRET" ]; then
            printf '{"totpSecret":"%s"}\n' "$TOTP_SECRET" > config.json
          fi

      - name: Install dependencies
        run: npm install

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14