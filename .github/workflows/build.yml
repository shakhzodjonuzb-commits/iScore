
name: Build IPTV Player

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK (Phone + TV)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Install Android packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build APKs
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          gradle --no-daemon clean assembleDebug assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Android
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows EXE
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inject TOTP secret
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          if [ -n "$TOTP_SECRET" ]; then
            echo "{\"totpSecret\":\"$TOTP_SECRET\"}" > config.json
          fi

      - name: Install dependencies
        run: npm install

      - name: Build Windows EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64 --publish never

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 14
