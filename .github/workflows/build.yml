name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Android APK (Phone + TV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build APK
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Android
          path: app/build/outputs/apk/**/*.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Inject TOTP secret (ixtiyoriy)
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: |
          if [ -n "$TOTP_SECRET" ]; then
            echo "{\"totpSecret\":\"$TOTP_SECRET\"}" > config.json
          fi

      - run: npm install

      - name: Build portable EXE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win portable --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-Player-Windows
          path: desktop/dist/*.exe
